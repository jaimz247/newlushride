<!doctype html>
<html lang="en" class="scroll-smooth bg-[#050505]">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LushRide - Luxury in Motion</title>
    <meta name="description" content="Experience Lagos with LushRide. Premium chauffeur services, executive transfers, and luxury hourly car hire." />
    <meta name="theme-color" content="#050505" />
    <meta name="google-site-verification" content="MlPNNaqlcSAzAlFyume7SYBBQwRp3y0VcaE-GCayD1c" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Open Graph / Social -->
    <meta property="og:title" content="LushRide - Luxury in Motion" />
    <meta property="og:description" content="Premium chauffeur services, executive transfers, and luxury hourly car hire in Lagos." />
    <meta property="og:image" content="/lexus1.jpg" />
    <link rel="preload" as="image" href="https://upload.wikimedia.org/wikipedia/commons/1/17/2022_Land_Rover_Range_Rover_SE_P440e_AWD_Automatic_3.0_Front.jpg" />
    <!-- Additional Meta -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <!-- JSON-LD Structured Data for Local Business -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "LushRide Worldwide",
        "image": "https://lushride.ng/lexus1.jpg",
        "@id": "https://lushride.ng/#localbusiness",
        "url": "https://lushride.ng",
        "telephone": "+2348000000000",
        "priceRange": "$$$$",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Lagos Executive Terminal",
          "addressLocality": "Lagos",
          "addressRegion": "Lagos State",
          "postalCode": "100001",
          "addressCountry": "NG"
        },
        "geo": {
          "@type": "GeoCoordinates",
          "latitude": 6.5244,
          "longitude": 3.3792
        },
        "openingHoursSpecification": {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": [
            "Monday",
            "Tuesday",
            "Wednesday",
            "Thursday",
            "Friday",
            "Saturday",
            "Sunday"
          ],
          "opens": "00:00",
          "closes": "23:59"
        },
        "sameAs": [
          "https://www.instagram.com/lushrideng/",
          "https://twitter.com/lushride"
        ],
        "description": "Lagos' finest premium chauffeur service. Absolute comfort, uncompromising privacy, and precision scheduling for the elite."
      }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((registration) => {
            console.log('SW registered: ', registration);
          }).catch((registrationError) => {
            console.log('SW registration failed: ', registrationError);
          });
        });
      }
    </script>
  </body>
</html>
